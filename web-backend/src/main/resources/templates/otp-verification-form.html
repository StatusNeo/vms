<div th:fragment="otpForm" id="form-content" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="space-y-6">
        <div class="text-center text-green-600 mb-4">
            <svg class="inline w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p class="font-medium">OTP sent to <span th:text="${phone}">+91 98765 43210</span></p>
        </div>

        <div class="space-y-2">
            <label for="otp" class="block text-sm font-medium text-gray-700 text-center">
                Enter OTP sent to your phone *
            </label>
            <input type="text"
                   id="otp"
                   name="otp"
                   required
                   maxlength="6"
                   pattern="[0-9]{6}"
                   class="w-full px-4 py-3 border-2 border-green-500 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors text-center text-2xl tracking-widest"
                   placeholder="000000">
        </div>

        <div class="flex justify-center gap-4">
            <button type="button"
                    hx-get="/api/visitor/resend-otp"
                    hx-target="#form-content"
                    hx-swap="outerHTML"
                    class="px-6 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition-colors">
                Resend OTP
            </button>
            <button type="button"
                    hx-post="/api/visitor/verify-otp"
                    hx-include="[name='otp']"
                    hx-target="#visitor-form"
                    hx-swap="outerHTML"
                    class="px-8 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition-colors min-w-48">
                <span class="htmx-indicator:hidden">Verify &amp; Check In</span>
                <span class="htmx-indicator">Verifying...</span>
            </button>
        </div>

        <div class="text-center">
            <button type="button"
                    onclick="window.location.reload()"
                    class="text-sm text-blue-600 hover:text-blue-800 underline">
                Start Over
            </button>
        </div>
    </div>
</div>
