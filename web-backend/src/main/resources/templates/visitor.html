<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Check-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { height: 100%; overflow: hidden; }
        body { height: 100vh; overflow: hidden; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 h-screen w-screen overflow-hidden">
<div class="container mx-auto px-4 py-8 max-w-4xl h-full flex flex-col justify-center">
    <div class="text-center mb-8 flex-shrink-0">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Visitor Check-in</h1>
        <p class="text-gray-600">Please fill in your details to register your visit</p>
    </div>
    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <form id="visitor-form"
              action="/api/visitor/send-otp"
              method="POST"
              class="space-y-6 h-full flex flex-col">
            <div id="form-content">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="name" class="block text-sm font-medium text-gray-700 flex items-center">
                            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            <span class="align-middle">Full Name *</span>
                        </label>
                        <input type="text"
                               id="name"
                               name="name"
                               required
                               value=""
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                               placeholder="Enter your full name">
                    </div>
                    <div class="space-y-2">
                        <label for="email" class="block text-sm font-medium text-gray-700 flex items-center">
                            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <span class="align-middle">Email Address *</span>
                        </label>
                        <input type="email"
                               id="email"
                               name="email"
                               required
                               value=""
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                               placeholder="Enter your email address">
                    </div>

                    <div class="space-y-2">
                        <label for="phone" class="block text-sm font-medium text-gray-700 flex items-center">
                            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                            </svg>
                            <span class="align-middle">Phone Number *</span>
                        </label>
                        <input type="tel"
                               id="phone"
                               name="phoneNumber"
                               required
                               value=""
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                               placeholder="Enter your phone number">
                    </div>
                    <div class="space-y-2">
                        <label for="company" class="block text-sm font-medium text-gray-700 flex items-center">
                            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                            </svg>
                            <span class="align-middle">Company *</span>
                        </label>
                        <input type="text"
                               id="company"
                               name="company"
                               required
                               value=""
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                               placeholder="Enter your company name">
                    </div>
                    <div class="space-y-2">
                        <label for="laptop" class="block text-sm font-medium text-gray-700 flex items-center">
                            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <span class="align-middle">Laptop Number</span>
                        </label>
                        <input type="text"
                               id="laptop"
                               name="laptop"
                               value=""
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                               placeholder="Enter your laptop number (optional)">
                    </div>
                    <div class="space-y-2">
                        <label for="govtId" class="block text-sm font-medium text-gray-700 flex items-center">
                            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-7 0V4a2 2 0 012-2h4a2 2 0 012 2v2M7 12h10m-10 4h10"/>
                            </svg>
                            <span class="align-middle">Valid Govt ID (DL / PAN / Aadhaar) *</span>
                        </label>
                        <input type="text"
                               id="govtId"
                               name="govtId"
                               required
                               value=""
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                               placeholder="Enter your government ID number">
                    </div>
                    <div class="space-y-2">
                        <label for="host-search" class="block text-sm font-medium text-gray-700 flex items-center">
                            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            <span class="align-middle">Who are you visiting? *</span>
                        </label>
                        <div class="relative">
                            <input type="text"
                                   id="host-search"
                                   name="hostSearch"
                                   autocomplete="off"
                                   class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                                   placeholder="Search by name or email...">
                            <input type="hidden" id="host" name="host" value="">
                            <svg class="absolute right-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                            <div id="search-spinner" class="absolute right-10 top-1/2 transform -translate-y-1/2 hidden">
                                <svg class="animate-spin h-5 w-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </div>
                            <div id="host-results"
                                 class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-48 overflow-y-auto hidden">
                            </div>
                        </div>
                    </div>


                    <div class="space-y-2">
                        <label for="visit-purpose" class="block text-sm font-medium text-gray-700">

                            <svg class="inline w-4 h-4 mr-1 text-gray-500 align-middle" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>

                            <span class="align-middle">Visit Purpose <span class="text-gray-700">*</span></span>
                        </label>

                        <select id="visit-purpose" name="visit-purpose"
                                class="mt-1 block w-full pl-3 pr-10 py-3 text-base border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md shadow-sm transition-colors">
                            <option value="">-- Select purpose --</option>
                            <option value="vendor">Vendor</option>
                            <option value="client_visit">Client Visit</option>
                            <option value="interview">Interview</option>
                            <option value="business_meeting">Business Meeting</option>
                        </select>
                    </div>
                </div>
                <!--            </div>-->


                <div class="flex justify-center pt-4">
                    <button type="submit"
                            id="send-otp-btn"
                            disabled class="px-8 py-4 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors min-w-48 text-lg relative flex items-center justify-center">
                        <span>Send OTP</span>
                    </button>
                </div>
            </div>
            <div class="mt-6 text-center text-sm text-gray-500">
                By checking in, you agree to our visitor policies and terms of service.
            </div>
        </form>
    </div>
</div>
<script>
    // Sample host data (replace with API call)
    const hostEmployees = [
        { id: 1, name: 'John Smith', email: 'john.smith@company.com' },
        { id: 2, name: 'Sarah Johnson', email: 'sarah.johnson@company.com' },
        { id: 3, name: 'Mike Davis', email: 'mike.davis@company.com' },
        { id: 4, name: 'Emily Chen', email: 'emily.chen@company.com' },
        { id: 5, name: 'David Wilson', email: 'david.wilson@company.com' },
        { id: 6, name: 'Lisa Brown', email: 'lisa.brown@company.com' },
        { id: 7, name: 'Robert Taylor', email: 'robert.taylor@company.com' },
        { id: 8, name: 'Jennifer Martinez', email: 'jennifer.martinez@company.com' }
    ];

    let selectedHostId = null;
    let otpSent = false;

// Form validation (host is not mandatory)
function validateForm() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const company = document.getElementById('company').value;
        const govtId = document.getElementById('govtId').value;
        const visitPurpose = document.getElementById('visit-purpose').value;

        const isValid = name && email && phone && company && govtId && visitPurpose;
        document.getElementById('send-otp-btn').disabled = !isValid;
    }

    document.querySelectorAll('input[required]').forEach(input => {
        input.addEventListener('input', validateForm);
    });

    document.getElementById('visit-purpose').addEventListener('change', validateForm);

    validateForm();

    // Host search functionality
    const hostSearchInput = document.getElementById('host-search');
    const hostResults = document.getElementById('host-results');

    hostSearchInput.addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();

        if (searchTerm.length === 0) {
            hostResults.classList.add('hidden');
            return;
        }

        const filtered = hostEmployees.filter(host =>
            host.name.toLowerCase().includes(searchTerm) ||
            host.email.toLowerCase().includes(searchTerm)
        );

        renderHostResults(filtered);
    });

    hostSearchInput.addEventListener('focus', function() {
        if (hostSearchInput.value.length > 0) {
            hostResults.classList.remove('hidden');
        }
    });

    function renderHostResults(hosts) {
        if (hosts.length === 0) {
            hostResults.innerHTML = '<div class="px-4 py-3 text-gray-500 text-center">No employee found</div>';
        } else {
            hostResults.innerHTML = hosts.map(host => `
                <div onclick="selectHost(${host.id}, '${host.name}', '${host.email}')"
                     class="px-4 py-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-b-0">
                    <div class="font-medium text-gray-900">${host.name}</div>
                    <div class="text-sm text-gray-500">${host.email}</div>
                </div>
            `).join('');
        }
        hostResults.classList.remove('hidden');
    }

    function selectHost(hostId, hostName, hostEmail) {
        hostSearchInput.value = `${hostName} (${hostEmail})`;
        document.getElementById('host').value = hostId;
        selectedHostId = hostId;
        hostResults.classList.add('hidden');
        validateForm();
    }

    // Click outside to close dropdown
    document.addEventListener('click', function(e) {
        if (!hostSearchInput.contains(e.target) && !hostResults.contains(e.target)) {
            hostResults.classList.add('hidden');
        }
    });

    // Handle Send OTP
    async function handleSendOTP() {
        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            company: document.getElementById('company').value,
            host: document.getElementById('host').value
        };

        // Show loading state
        const btn = document.getElementById('send-otp-btn');
        btn.disabled = true;
        btn.innerHTML = `
            <svg class="inline animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Sending...
        `;

        // Simulate API call
        await new Promise(resolve => setTimeout(resolve, 1500));

        // Replace form content with OTP verification
        showOTPVerification(formData.phone);
    }

    function showOTPVerification(phone) {
        const formContent = document.getElementById('form-content');
        formContent.innerHTML = `
            <div class="space-y-6">
                <div class="text-center text-green-600 mb-4">
                    <svg class="inline w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="font-medium">OTP sent to ${phone}</p>
                </div>

                <div class="space-y-2">
                    <label for="otp" class="block text-sm font-medium text-gray-700 text-center">
                        Enter OTP sent to your phone *
                    </label>
                    <input type="text"
                           id="otp"
                           name="otp"
                           required
                           maxlength="6"
                           pattern="[0-9]{6}"
                           class="w-full px-4 py-3 border-2 border-green-500 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors text-center text-2xl tracking-widest"
                           placeholder="000000">
                </div>

                <div class="flex justify-center gap-4">
                    <button type="button"
                            onclick="handleResendOTP()"
                            class="px-6 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition-colors">
                        Resend OTP
                    </button>
                    <button type="button"
                            id="verify-btn"
                            onclick="handleVerifyOTP()"
                            disabled
                            class="px-8 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors min-w-48">
                        Verify &amp; Check In
                    </button>
                </div>

                <div class="text-center">
                    <button type="button"
                            onclick="window.location.reload()"
                            class="text-sm text-blue-600 hover:text-blue-800 underline">
                        Start Over
                    </button>
                </div>
            </div>
        `;

        // Add OTP input validation
        const otpInput = document.getElementById('otp');
        const verifyBtn = document.getElementById('verify-btn');

        otpInput.addEventListener('input', function(e) {
            // Only allow numbers
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            // Enable button when 6 digits entered
            verifyBtn.disabled = e.target.value.length !== 6;
        });

        otpInput.focus();
    }

    async function handleResendOTP() {
        // Simulate resend API call
        await new Promise(resolve => setTimeout(resolve, 1000));
        alert('OTP resent successfully!');
    }

    async function handleVerifyOTP() {
        const otp = document.getElementById('otp').value;
        const btn = document.getElementById('verify-btn');

        // Show loading state
        btn.disabled = true;
        btn.innerHTML = `
            <svg class="inline animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Verifying...
        `;

        // Simulate API call
        await new Promise(resolve => setTimeout(resolve, 1500));

        // Show success message
        showSuccessMessage();
    }

    function showSuccessMessage() {
        const form = document.getElementById('visitor-form');
        form.innerHTML = `
            <div class="text-center py-12">
                <svg class="inline w-20 h-20 text-green-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Check-in Successful!</h2>
                <p class="text-gray-600 mb-6">Welcome to our office</p>
                <p class="text-gray-600 mb-8">Your host has been notified.</p>
                <button onclick="window.location.reload()"
                        class="px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">
                    Check in Another Visitor
                </button>
            </div>
        `;
    }
</script>
</body>
</html>
