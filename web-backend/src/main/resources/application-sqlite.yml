spring:
  datasource:
    url: jdbc:sqlite:vms.db
    driver-class-name: org.sqlite.JDBC
    username: 
    password: 
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    
# SQLite does not require Flyway migrations since schema is managed by Hibernate
flyway:
  enabled: false
