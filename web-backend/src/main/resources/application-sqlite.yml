spring:
  datasource:
    url: jdbc:sqlite:vms.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false

# Dev-friendly template settings (hot reload via classpath rendering)
gg:
  jte:
    developmentMode: true
    usePrecompiledTemplates: false

logging:
  level:
    gg.jte: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: INFO

vms:
  system-email: dev-system@local.test
  admin-email: admin@local.test
  sync:
    onstartup:
      enabled: false

# Local WireMock email transport (used by WiremockMailServiceImpl for the sqlite/dev profile)
wiremock:
  server:
    port: 8081
mail:
  url: http://localhost:${wiremock.server.port}/v1.0/users/%s/sendMail
